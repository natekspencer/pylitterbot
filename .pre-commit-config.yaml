repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.6
    hooks:
      # Update the uv lockfile
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      # Type check, as CI does. pre-commit.ci skips this, as it can't run system hooks.
      - id: mypy
        name: mypy
        # Sync dependencies, with every extra as CI does, without building the package:
        # a build rewrites __version__, which pre-commit treats as the hook changing files.
        entry: sh -c 'uv sync --quiet --inexact --no-install-project --all-extras && uv run --no-sync mypy .'
        language: system
        # Python code, mypy's settings (setup.cfg) and version, and this hook's own config
        files: (\.pyi?$|^(pyproject\.toml|setup\.cfg|uv\.lock|\.pre-commit-config\.yaml)$)
        pass_filenames: false

ci:
  skip: [mypy]
